[project]
name = "sparv-sbx-ner-torch-kb-ner"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kristoffer Andersson", email = "kristoffer.andersson@gu.se" },
]
dependencies = ["sparv-pipeline>=5.2.0", "transformers>=4.34.1"]
readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."sparv.plugin"]
sbx_ner_torch_kb_ner = "sbx_ner_torch_kb_ner"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/sbx_ner_torch_kb_ner"]

[tool.hatch.metadata]
allow-direct-references = true
